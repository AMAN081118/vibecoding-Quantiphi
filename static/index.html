<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FlowBoard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">TASK MANAGEMENT</p>
        <h1>FlowBoard</h1>
      </div>
      <div class="actions">
        <select id="priority-filter" aria-label="Filter by priority">
          <option value="all">All priorities</option>
          <option value="high">High priority</option>
          <option value="medium">Medium priority</option>
          <option value="low">Low priority</option></select
        ><button id="add-task" class="primary">+ New task</button>
      </div>
    </header>
    <main>
      <section class="board-area">
        <div class="project-heading">
          <h2 id="project-name">Loading…</h2>
          <p>Drag cards between columns to update their status.</p>
        </div>
        <div id="board" class="board"></div>
      </section>
      <aside class="team">
        <div class="team-head">
          <div>
            <p class="eyebrow">PROJECT TEAM</p>
            <h2>People</h2>
          </div>
          <button id="add-member" aria-label="Add team member">+</button>
        </div>
        <div id="members"></div>
        <p class="hint">
          <span class="red-dot"></span> A pulsing avatar means more than 5
          active tasks.
        </p>
      </aside>
    </main>
    <dialog id="task-dialog">
      <form id="task-form" method="dialog">
        <div class="modal-head">
          <h2 id="task-form-title">New task</h2>
          <button type="button" class="close" data-close>&times;</button>
        </div>
        <input id="task-id" type="hidden" /><label
          >Title<input
            id="title"
            required
            maxlength="160"
            placeholder="What needs doing?" /></label
        ><label
          >Description<textarea
            id="description"
            rows="3"
            placeholder="Add context…"
          ></textarea>
        </label>
        <div class="form-row">
          <label
            >Priority<select id="priority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select></label
          ><label>Due date<input id="due-date" type="date" /></label>
        </div>
        <label
          >Assignee<select id="assignee">
            <option value="">Unassigned</option>
          </select></label
        >
        <div class="dialog-actions">
          <button type="button" id="delete-task" class="danger">Delete</button
          ><button type="submit" class="primary">Save task</button>
        </div>
      </form>
    </dialog>
    <dialog id="member-dialog">
      <form id="member-form" method="dialog">
        <div class="modal-head">
          <h2>Add a team member</h2>
          <button type="button" class="close" data-close>&times;</button>
        </div>
        <label
          >Name<input
            id="member-name"
            required
            placeholder="Jordan Lee" /></label
        ><label
          >Email<input
            id="member-email"
            type="email"
            required
            placeholder="jordan@example.com" /></label
        ><label
          >Role<select id="member-role">
            <option value="member">Member</option>
            <option value="owner">Owner</option>
          </select></label
        >
        <div class="dialog-actions">
          <button type="submit" class="primary">Add member</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
